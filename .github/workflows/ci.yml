name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Типы, линтер, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        # Пока pnpm-lock.yaml нет в репозитории — ставим без него и сохраняем получившийся lock-файл.
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Сохранить lock-файл
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 7

      - name: Проверка типов
        run: pnpm typecheck

      - name: Линтер
        run: pnpm lint

      - name: Тесты
        run: pnpm test

      - name: Сборка Pen Lab и приложения
        run: |
          pnpm --filter @kayospace/pen-lab build
          pnpm --filter @kayospace/pen-lab build:single
          pnpm --filter @kayospace/workspace build

      - name: Pen Lab одним файлом
        uses: actions/upload-artifact@v4
        with:
          name: pen-lab
          path: apps/pen-lab/dist-single/pen-lab.html
          retention-days: 14

  e2e:
    name: Проверка в браузере
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Браузер для тестов
        run: pnpm --filter @kayospace/e2e exec playwright install --with-deps chromium

      - name: Сборка Pen Lab и приложения
        run: |
          pnpm --filter @kayospace/pen-lab build
          pnpm --filter @kayospace/workspace build

      - name: Тесты в браузере (вместе с хабом)
        env:
          SCREENSHOTS_DIR: ${{ github.workspace }}/e2e/screens
        run: pnpm --filter @kayospace/e2e e2e

      - name: Отчёт о проверке
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/test-results
            e2e/screens
          retention-days: 7

      # Скриншоты кладём в отдельную ветку ci-previews: их можно скачать обычным git fetch.
      - name: Скриншоты в ветку ci-previews
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          if ! ls e2e/screens/*.png >/dev/null 2>&1; then echo "скриншотов нет"; exit 0; fi
          dir="previews/${REF_NAME//\//-}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp"
          # Каждый прогон пишет только свою папку, поэтому при гонке просто повторяем поверх свежей ветки.
          for i in 1 2 3; do
            if git -C "$tmp" fetch --depth 1 origin ci-previews 2>/dev/null; then
              git -C "$tmp" checkout -qf -B ci-previews FETCH_HEAD
            else
              git -C "$tmp" checkout -qf --orphan ci-previews
              git -C "$tmp" rm -rfq --ignore-unmatch .
            fi
            rm -rf "${tmp:?}/$dir"
            mkdir -p "$tmp/$dir"
            cp e2e/screens/*.png "$tmp/$dir/"
            printf '%s\n' "$GITHUB_SHA" > "$tmp/$dir/SHA"
            git -C "$tmp" add -A
            if git -C "$tmp" diff --cached --quiet; then echo "без изменений"; exit 0; fi
            git -C "$tmp" commit -qm "previews: $REF_NAME @ ${GITHUB_SHA:0:7}"
            if git -C "$tmp" push origin ci-previews; then exit 0; fi
          done
          exit 1

  hub-image:
    name: Образ хаба для VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Скрипт установки (shellcheck)
        run: shellcheck deploy/setup.sh

      - name: Compose-файл
        run: |
          HUB_DOMAIN=example.sslip.io HUB_TOKEN=x docker compose -f deploy/docker-compose.yml config -q
          HUB_DOMAIN=example.sslip.io HUB_TOKEN=x HTTPS_PORT=8443 docker compose -f deploy/docker-compose.yml config | grep -q 'published: "8443"'

      - name: Caddyfile
        run: |
          for port in 443 8443; do
            docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -e HUB_DOMAIN=example.sslip.io -e HTTPS_PORT=$port caddy:2 caddy validate --config /etc/caddy/Caddyfile
          done

      - name: Сборка образа
        run: docker build -f deploy/hub.Dockerfile -t kayospace-hub .

      - name: Запуск и проверка доступа
        run: |
          docker run -d --name hub -p 4000:4000 -e HUB_TOKEN=ci-token -e PUBLIC_HOST=example.sslip.io kayospace-hub
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/health && break; sleep 2; done
          echo
          curl -fsS http://127.0.0.1:4000/health | grep -q '"auth":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/boards)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://127.0.0.1:4000/api/boards)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4000/mcp)" = 401
          echo "Образ работает, доступ по токену проверен"

      - name: Логи хаба
        if: always()
        run: docker logs hub || true
