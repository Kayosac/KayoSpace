name: Сборка приложения

# Запуск вручную (Actions → «Сборка приложения» → Run workflow) или по тегу v*.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Платформы через запятую: android, macos, windows'
        required: true
        default: 'android,macos,windows'
  push:
    tags: ['v*']

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: ${{ github.event.inputs.platforms || 'android,macos,windows' }}
  NDK_VERSION: '27.2.12479018'

jobs:
  android:
    name: Android (APK)
    if: contains(github.event.inputs.platforms || 'android', 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK и NDK
        # SDK уже предустановлен на раннере ($ANDROID_HOME) — доставляем только нужные пакеты.
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - name: Установка зависимостей
        run: pnpm install --no-frozen-lockfile

      - name: Android-проект и иконки
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          pnpm --filter @kayospace/app tauri android init --ci
          pnpm --filter @kayospace/app tauri icon app-icon.png

      - name: Сборка APK (debug, ARM64)
        # Debug-сборка подписана отладочным ключом, поэтому её можно сразу поставить на планшет.
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          pnpm --filter @kayospace/app tauri android build --apk --debug --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: kayospace-android-apk
          path: apps/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            key: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: apps/app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            key: windows
            os: windows-latest
            rust_targets: ''
            args: ''
            bundle: |
              apps/app/src-tauri/target/release/bundle/msi/*.msi
              apps/app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Пропустить, если платформа не выбрана
        id: gate
        shell: bash
        run: |
          if [[ ",${PLATFORMS}," == *",${{ matrix.key }},"* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: apps/app/src-tauri -> target

      - name: Установка зависимостей
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Сборка
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @kayospace/app tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: kayospace-${{ matrix.key }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 30
