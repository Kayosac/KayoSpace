name: Сборка приложения

# Запуск вручную (Actions → «Сборка приложения» → Run workflow) или по тегу v*.
# По тегу v* все сборки публикуются в GitHub Release вместе с latest.json — по нему приложения
# на компьютере обновляются сами, Android предлагает скачать новый APK (решение 0011).
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Платформы через запятую: android, macos, windows'
        required: true
        default: 'android,macos,windows'
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: ${{ github.event.inputs.platforms || 'android,macos,windows' }}
  NDK_VERSION: '27.2.12479018'
  # Адрес хаба по умолчанию на экране подключения: Settings → Secrets and variables → Actions →
  # Variables → KAYOSPACE_DEFAULT_HUB (например, 1-2-3-4.sslip.io:8443). Не задан — поле пустое.
  VITE_DEFAULT_HUB: ${{ vars.KAYOSPACE_DEFAULT_HUB }}

jobs:
  android:
    name: Android (APK)
    if: contains(github.event.inputs.platforms || 'android', 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK и NDK
        # SDK уже предустановлен на раннере ($ANDROID_HOME) — доставляем только нужные пакеты.
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - name: Установка зависимостей
        run: pnpm install --no-frozen-lockfile

      - name: Android-проект и иконки
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          pnpm --filter @kayospace/app tauri android init --ci
          pnpm --filter @kayospace/app tauri icon app-icon.png

      - name: Подпись APK постоянным ключом
        id: signing
        # Ключ из секретов (решение 0011): новая версия ставится поверх старой, только если ключ тот же.
        # Нет ключа — debug-сборка с отладочным ключом этой машины (поверх прежней не встанет).
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Нет ANDROID_KEYSTORE — debug-сборка, обновить поверх прежней версии не получится"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/kayospace.jks"
          node apps/app/scripts/android-signing.mjs apps/app/src-tauri/gen/android "$RUNNER_TEMP/kayospace.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Сборка APK (ARM64)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            pnpm --filter @kayospace/app tauri android build --apk --target aarch64
          else
            pnpm --filter @kayospace/app tauri android build --apk --debug --target aarch64
          fi

      - name: Подпись APK — проверка
        if: steps.signing.outputs.signed == 'true'
        run: |
          APK=$(find apps/app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$APK" || { echo "::error::Нет release APK"; exit 1; }
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | head -3

      - name: Понятное имя файла
        run: |
          mkdir -p out
          APK=$(find apps/app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" "out/kayospace-${GITHUB_REF_NAME//\//-}-android-arm64.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: kayospace-android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            key: macos
            # Intel-машины: у GitHub не хватает ARM-машин с macOS (задачи часами ждут в очереди
            # и отменяются). Универсальная сборка (ARM + Intel) с Intel-машины собирается так же.
            os: macos-15-intel
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: |
              apps/app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              apps/app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
              apps/app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig
          - name: Windows
            key: windows
            os: windows-latest
            rust_targets: ''
            args: ''
            bundle: |
              apps/app/src-tauri/target/release/bundle/msi/*.msi
              apps/app/src-tauri/target/release/bundle/nsis/*.exe
              apps/app/src-tauri/target/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Пропустить, если платформа не выбрана
        id: gate
        shell: bash
        run: |
          if [[ ",${PLATFORMS}," == *",${{ matrix.key }},"* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: apps/app/src-tauri -> target

      - name: Установка зависимостей
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Сборка
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          # Ключ подписи обновлений (решение 0011). Есть — сборка выпускает ещё и подписанные
          # файлы обновления (.tar.gz/.exe + .sig); нет — обычная сборка без автообновления.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXTRA=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then EXTRA="--config src-tauri/tauri.updater.conf.json"; else echo "::warning::Нет TAURI_SIGNING_PRIVATE_KEY — сборка без файлов автообновления"; fi
          pnpm --filter @kayospace/app tauri build ${{ matrix.args }} $EXTRA

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: kayospace-${{ matrix.key }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Релиз
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: find dist -type f -exec ls -la {} \;

      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: apps/app/scripts

      - name: Список версий для автообновления (latest.json)
        run: node src/apps/app/scripts/latest-json.mjs dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > dist/latest.json && cat dist/latest.json

      # Обычный (не предварительный) релиз: приложения берут latest.json из «последнего релиза».
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          make_latest: true
          generate_release_notes: true
