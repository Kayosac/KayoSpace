[package]
name = "tauri-plugin-share-target"
version = "0.1.0"
description = "Kayospace: «Поделиться» в Android — текст, ссылки и картинки попадают на доску «Входящие»"
edition = "2021"
rust-version = "1.77.2"
publish = false
# Нужно Tauri, чтобы подключить Android-часть плагина к сборке приложения.
links = "tauri-plugin-share-target"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
