[package]
name = "kayospace"
version = "0.10.0"
description = "Kayospace — личный воркспейс с бесконечным холстом"
authors = ["kayos"]
edition = "2021"

[lib]
# Отдельное имя библиотеки нужно для сборки под Android/iOS (staticlib/cdylib).
name = "kayospace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ссылки kayospace://connect?hub=…&code=… (QR подключения устройства).
tauri-plugin-deep-link = "2"
# Токен устройства в хранилище ОС: Keychain, Credential Manager, Android Keystore.
tauri-plugin-secure-store = { path = "plugins/secure-store" }
# «Поделиться» в Android: текст, ссылки и картинки — на доску «Входящие».
tauri-plugin-share-target = { path = "plugins/share-target" }
# Экспорт доски: диалог «Сохранить как» и запись выбранного файла.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Открыть ссылку в браузере системы (на Android — скачать новую версию APK).
tauri-plugin-opener = "2"

# Второй запуск по ссылке kayospace:// передаёт её уже открытому окну, а не открывает новое.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Автообновление (решение 0011): подписанные сборки из релизов GitHub, перезапуск после установки.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Сканер QR в приложении — только на телефонах и планшетах.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
