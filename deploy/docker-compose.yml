# Хаб Kayospace на VPS: хаб + Caddy (автоматический HTTPS от Let's Encrypt)
# и, по желанию, исполнитель ИИ (Claude Code на вашей подписке — решение 0007).
# Переменные берутся из deploy/.env (его создаёт setup.sh).
# Исполнитель ИИ включается строками в .env: COMPOSE_PROFILES=ai и CLAUDE_CODE_OAUTH_TOKEN=…
name: kayospace

# Логи контейнеров не растут бесконечно: до 3 файлов по 10 МБ.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  hub:
    build:
      context: ..
      dockerfile: deploy/hub.Dockerfile
    restart: unless-stopped
    environment:
      HUB_TOKEN: ${HUB_TOKEN:?Задайте HUB_TOKEN в deploy/.env}
      PUBLIC_HOST: ${HUB_DOMAIN:?Задайте HUB_DOMAIN в deploy/.env}
      # Внешний адрес — для QR подключения устройств (`docker compose exec hub pnpm pair`).
      PUBLIC_URL: https://${HUB_DOMAIN}:${HTTPS_PORT:-443}
      # Исполнитель ИИ ходит к хабу внутри docker-сети по имени hub.
      INTERNAL_HOSTS: hub
    volumes:
      - hub-data:/data
    mem_limit: ${HUB_MEMORY:-768m}
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # 80 — выдача сертификата; HTTPS — 443 или другой порт, если 443 занят (HTTPS_PORT в .env)
      - '80:80'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub
    mem_limit: 192m
    logging: *logging

  # Исполнитель ИИ: берёт задачи кнопки «✦ ИИ» и выполняет их официальным Claude Code.
  # Токен подписки: на своём компьютере `claude setup-token`, строку — в CLAUDE_CODE_OAUTH_TOKEN.
  ai-worker:
    profiles: [ai]
    build:
      context: ..
      dockerfile: deploy/ai-worker.Dockerfile
    restart: unless-stopped
    environment:
      HUB_URL: http://hub:4000
      HUB_TOKEN: ${HUB_TOKEN}
      WORKER_NAME: ${AI_WORKER_NAME:-сервер}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    depends_on:
      - hub
    # Одна задача за раз; Claude Code — это Node, ему хватает ~1 ГБ.
    mem_limit: ${AI_WORKER_MEMORY:-1g}
    logging: *logging

volumes:
  hub-data:
  caddy-data:
  caddy-config:
